data:
  # 输入 active 点云的体素大小，单位为厘米；应与 point_clouds_voxel_1cm 保持一致。
  voxel_size_cm: 1.0
  # direction-filtered 正点高斯监督的标准差，单位为输入 voxel 数。
  heatmap_sigma_voxels: 8.0
  # 复用由旧 active_aligned 逐条映射得到的 enriched train/valid/test 划分文件。
  split_dir: data/splits/active_aligned_enriched
  valid_fraction: 0.1
  test_fraction: 0.1
  split_seed: 20260624
  max_train_samples:
  max_valid_samples:
  # canonical 数据源，以及对应生成的 free_bbox placement 和 enriched label 结果。
  sources:
    - name: dopose
      dataset_dir: data/dopose
      free_bbox_dir: outputs/free_bbox_dopose
      labels_path: outputs/enriched_label_outputs_dopose/auto_labels_dopose/all_labels_enriched.json
    - name: hope
      dataset_dir: data/hope
      free_bbox_dir: outputs/free_bbox_hope
      labels_path: outputs/enriched_label_outputs_hope/auto_labels_hope/all_labels_enriched.json
    - name: housecat
      dataset_dir: data/housecat
      free_bbox_dir: outputs/free_bbox_housecat
      labels_path: outputs/enriched_label_outputs_housecat/auto_labels_housecat/all_labels_enriched.json
    - name: omni
      dataset_dir: data/omni_filter
      free_bbox_dir: outputs/free_bbox_omni
      labels_path: outputs/enriched_label_outputs_omni/auto_labels_omni/all_labels_enriched.json
    - name: ycbv
      dataset_dir: data/ycbv
      free_bbox_dir: outputs/free_bbox_ycbv
      labels_path: outputs/enriched_label_outputs_ycbv/auto_labels_ycbv/all_labels_enriched.json

model:
  hidden_dim: 256
  backbone:
    type: spconv
    in_channels: 70
    num_blocks: 3
  clip:
    model_name_or_path: /data/limengfei/xingqunqi/models/clip-vit-base-patch16
    freeze: true
    max_length: 77
    voxel_feature_dim: 64
    local_files_only: true
  fusion:
    num_heads: 8
    dropout: 0.1
  source_grounding:
    num_heads: 8
    num_layers: 4
    dropout: 0.1
  space_former:
    voxel_size_cm: 1.0
    num_heads: 8
    dropout: 0.1
    # Text-Guided Region Cross Encoder 的 Cross Block 层数。
    region_cross_num_layers: 4
    # P3 hard proposal 保留得分最高的 8 个区域，再展开为固定 48 个 Query。
    num_region_cells: 8

loss:
  # Source Size 归一化中心距离超过该代价时，Hungarian 可将 Query 分配给背景。
  background_match_cost: 0.25
  lambda_region: 500.0
  lambda_cls: 1.0
  lambda_center: 5.0
  lambda_yaw: 0.5
  lambda_corner: 0.5
  lambda_src: 0.5
  lambda_aux: 0.1
  focal:
    alpha: 0.25
    gamma: 2.0
  source:
    lambda_center: 4.0
    lambda_size: 2.0
    lambda_iou: 0.2

validation:
  size_iou_threshold: 0.8

training:
  output_dir: outputs/lc_bgplacenet_stage2_space_former_aligned_loss_48query_full_gt_guass_8_enriched
  # 留空表示不从配置默认加载 Stage 1 checkpoint；可通过 CLI --stage1-checkpoint 显式传入。
  stage1_pretrained_checkpoint:
  device: auto
  seed: 20260624
  epochs: 65
  batch_size: 8
  num_workers: 8
  pin_memory: true
  progress_bar: true
  lr: 0.0001
  # Stage 1 参数组自动使用主学习率的 0.1 倍；ReduceLROnPlateau 监控 validation task_success_rate。
  lr_scheduler:
    type: reduce_on_plateau
    mode: max
    factor: 0.5
    patience: 3
    threshold: 0.001
    threshold_mode: abs
  weight_decay: 0.01
  grad_clip_norm: 1.0
  log_every: 300
